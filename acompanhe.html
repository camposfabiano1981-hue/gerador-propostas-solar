<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E3A8A">
  <title>Acompanhe sua obra</title>
  <meta name="description" content="Acompanhamento das etapas da instalação do seu sistema de energia solar.">
  <link rel="icon" type="image/svg+xml" href="assets/icones/icone.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icones/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <style>
    :root {
      --azul: #1E3A8A; --azul-2: #2563EB; --azul-claro: #EFF6FF; --dourado: #F59E0B; --verde: #15803D; --verde-bg: #DCFCE7;
      --texto: #0F172A; --texto-2: #334155; --muted: #64748B; --borda: #E2E8F0; --bg: #F1F5F9; --card: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
    .topo { display: flex; align-items: center; gap: 12px; padding: 4px 0 14px; }
    .topo img { max-height: 52px; max-width: 150px; object-fit: contain; border-radius: 6px; background: #fff; }
    .topo strong { display: block; color: var(--azul); font-size: 16px; }
    .topo small { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, .05); }
    .ola { margin: 0 0 2px; font-size: 22px; color: var(--azul); }
    .sub { margin: 0; color: var(--texto-2); }
    .sistema { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--azul-claro); color: var(--azul); font-weight: 600; }
    .progresso { margin-top: 16px; }
    .progresso-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .progresso-topo strong { font-size: 30px; color: var(--azul); font-variant-numeric: tabular-nums; }
    .barra { height: 12px; border-radius: 999px; background: #DBEAFE; overflow: hidden; margin: 6px 0 8px; }
    .barra span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--azul-2), #3B82F6); }
    .barra.feita span { background: linear-gradient(90deg, #16A34A, #22C55E); }
    .previsao { font-size: 14px; color: var(--texto-2); }
    .situacao { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #E2E8F0; color: var(--texto-2); }
    .situacao.andamento { background: #DBEAFE; color: var(--azul); }
    .situacao.concluida { background: var(--verde-bg); color: var(--verde); }
    h2 { font-size: 17px; margin: 0 0 12px; color: var(--azul); }
    .linha-tempo { list-style: none; margin: 0; padding: 0; }
    .linha-tempo li { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding-bottom: 16px; }
    .linha-tempo li:last-child { padding-bottom: 0; }
    .linha-tempo li:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--borda); }
    .linha-tempo li.concluida:not(:last-child)::before { background: #86EFAC; }
    .marca { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: #fff; border: 2px solid #CBD5E1; color: var(--muted); }
    li.concluida .marca { background: #16A34A; border-color: #16A34A; color: #fff; }
    li.andamento .marca { background: var(--azul-2); border-color: var(--azul-2); color: #fff; box-shadow: 0 0 0 5px rgba(37, 99, 235, .18); }
    .etapa-titulo { font-weight: 600; padding-top: 4px; }
    li.pendente .etapa-titulo { color: var(--texto-2); font-weight: 500; }
    .etapa-data { font-size: 13px; color: var(--muted); }
    li.concluida .etapa-data { color: var(--verde); }
    li.andamento .etapa-data { color: var(--azul-2); font-weight: 600; }
    .fotos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .fotos figure { margin: 0; }
    .fotos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 1px solid var(--borda); cursor: zoom-in; background: #fff; }
    .fotos figcaption { font-size: 12px; color: var(--texto-2); margin-top: 4px; }
    .contato { display: flex; flex-wrap: wrap; gap: 10px; }
    .botao { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; border: 1px solid var(--borda); color: var(--texto); background: #fff; flex: 1 1 200px; }
    .botao.whats { background: #16A34A; border-color: #16A34A; color: #fff; }
    .rodape { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
    .rodape button { border: 0; background: none; color: var(--azul-2); font: inherit; font-weight: 600; cursor: pointer; padding: 6px; }
    .aviso { text-align: center; padding: 40px 20px; }
    .aviso h1 { font-size: 20px; color: var(--azul); }
    .carregando { color: var(--muted); text-align: center; padding: 60px 0; }
    .aviso .detalhe { margin-top: 18px; font-size: 12px; color: var(--muted); }
    .zoom { position: fixed; inset: 0; background: rgba(15, 23, 42, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 9; }
    .zoom img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
    .zoom p { color: #fff; margin: 10px 0 0; text-align: center; }
  </style>
</head>
<body>
  <main id="pagina" aria-live="polite"><p class="carregando">Carregando o acompanhamento da sua obra…</p></main>
  <script src="js/nuvem-config.js?v=2026.10.30.7"></script>
  <script src="js/acompanhe.js?v=2026.10.30.7"></script>
</body>
</html>
